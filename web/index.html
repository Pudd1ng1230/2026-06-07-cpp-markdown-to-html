<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>md2html — Markdown 预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题栏 */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }

        .toolbar h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e94560;
        }

        .toolbar .status {
            font-size: 0.8rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
        }

        .toolbar .dot.loading {
            background: #ff9800;
            animation: pulse 0.8s infinite;
        }

        .toolbar .dot.error {
            background: #e94560;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 主区域：左右分栏 */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pane-header {
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            color: #aaa;
            flex-shrink: 0;
        }

        /* 左侧编辑器 */
        .editor-pane {
            border-right: 1px solid #0f3460;
        }

        .editor-pane textarea {
            flex: 1;
            width: 100%;
            padding: 1rem;
            background: #1a1a2e;
            color: #e0e0e0;
            border: none;
            resize: none;
            font-family: "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            outline: none;
            tab-size: 4;
        }

        .editor-pane textarea::placeholder {
            color: #555;
        }

        /* 右侧预览 */
        .preview-pane iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* 自适应 */
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }
            .editor-pane {
                border-right: none;
                border-bottom: 1px solid #0f3460;
                flex: 0 0 50%;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>📝 md2html</h1>
        <div class="status">
            <span class="dot" id="status-dot"></span>
            <span id="status-text">就绪</span>
        </div>
    </div>

    <div class="main">
        <div class="pane editor-pane">
            <div class="pane-header">Markdown</div>
            <textarea id="editor" placeholder="在这里输入 Markdown..."></textarea>
        </div>
        <div class="pane preview-pane">
            <div class="pane-header">预览</div>
            <iframe id="preview" title="预览"></iframe>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        let convertTimer = null;
        const DEBOUNCE_MS = 400;

        // 初始示例
        const sample = `# 欢迎使用 md2html

这是**第一个**段落，用于测试基本的 Markdown 转换功能。

## 无序列表

- 学习 **C++ 工程化**
- 掌握 *CMake* 构建系统
- 理解编译链接原理

## 链接

这是一个 [Markdown 语法指南](https://www.markdownguide.org) 的链接。

## 代码块

\`\`\`cpp
#include <iostream>

int main() {
    std::cout << "Hello, md2html!" << std::endl;
    return 0;
}
\`\`\`

## 内联代码与引用

使用 \`std::string\` 类型来存储文本。

> **引用块也支持内联格式**：可以包含 \`代码\`、**粗体**、*斜体*。

---

水平线以下是结尾。`;

        editor.value = sample;

        function setStatus(state, text) {
            statusDot.className = 'dot';
            if (state === 'loading') statusDot.classList.add('loading');
            if (state === 'error') statusDot.classList.add('error');
            statusText.textContent = text;
        }

        async function convert() {
            const markdown = editor.value;

            if (!markdown.trim()) {
                preview.srcdoc = '<html><body style="display:flex;align-items:center;justify-content:center;height:100vh;color:#aaa;font-family:sans-serif;">输入 Markdown 开始预览</body></html>';
                setStatus('ready', '就绪');
                return;
            }

            setStatus('loading', '转换中...');

            try {
                const resp = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ markdown }),
                });

                const data = await resp.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                preview.srcdoc = data.html;
                setStatus('ready', '就绪');
            } catch (err) {
                preview.srcdoc = `<html><body style="padding:2rem;color:#e94560;font-family:monospace;background:#1a1a2e;">
                    <h3>转换失败</h3>
                    <pre>${escapeHtml(err.message)}</pre>
                </body></html>`;
                setStatus('error', err.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 输入事件：防抖自动转换
        editor.addEventListener('input', () => {
            clearTimeout(convertTimer);
            convertTimer = setTimeout(convert, DEBOUNCE_MS);
        });

        // Tab 键支持
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
            }
        });

        // 初始转换
        convert();
    </script>
</body>
</html>
